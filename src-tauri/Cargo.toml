[package]
name = "wyss-console"
version = "0.2.0"
description = "Wyss Console desktop foundation"
edition = "2024"
rust-version = "1.90"
publish = false
default-run = "wyss-console"

[features]
# Development only: a local protocol-2 application with a fixture child, to look at the
# window with it active. No build of the installed desktop enables it.
f8-dev = []
# The isolated candidate authority `wyss-f8-fixture`: a protocol-2 authority whose runtime is
# a fixture child, not Codex. No packaged build enables it, and the package check refuses its
# markers.
f8-fixture = []
# Development and isolated acceptance only: a desktop whose Claude Managed runtime is hosted by
# this process (not the authority) against a mock provider API, to look at and drive the M3 window
# with the real SDK offline. No packaged build enables it, and the package check refuses its marker.
m3-fixture = ["tauri/custom-protocol"]

[[example]]
name = "f8_local_gui"
required-features = ["f8-dev"]

[[example]]
name = "m3_fixture_gui"
required-features = ["m3-fixture"]

[[bin]]
name = "wyss-f8-fixture"
path = "src/bin/wyss-f8-fixture.rs"
required-features = ["f8-fixture"]

[[test]]
name = "f8_fixture_process"
path = "tests/f8_fixture_process.rs"
required-features = ["f8-fixture"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same version Tauri already resolves for its GTK window. Used only to request
# KWin's blur through GDK's property API (no shell, no FFI).
gtk = "=0.18.2"

[dependencies]
sha2 = "0.10.9"
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a split ratio must decode to the exact f64 that was encoded (contracts::m1).
serde_json = { version = "1", features = ["float_roundtrip"] }
# ADR 0029: restoration records are sealed with authenticated encryption, and the key is
# generated from the OS random source. RustCrypto, no unsafe of our own, no network.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.3"
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
zeroize = "1"
# TOML is read, never written, in F1 (Codex's configuration). The version is the one
# tauri already brings, so no crate is added to the build.
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
uuid = { version = "=1.27.0", features = ["v4"] }
time = { version = "=0.3.55", features = ["parsing", "formatting"] }

portable-pty = { version = "=0.9.0", default-features = false }
nix = { version = "=0.28.0", default-features = false, features = ["dir", "fs", "inotify", "poll", "signal", "process", "user", "socket"] }

# The lifecycle hashes the authority binary it installs. A development build of that
# binary is hundreds of megabytes, and an unoptimized SHA-256 takes seconds over it.
[profile.dev.package.sha2]
opt-level = 3
# Passphrase stretching is 600,000 rounds of the same hash.
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3

[dev-dependencies]
tauri = { version = "=2.12.1", features = ["test"] }
# Test-only: a fault switch for the audit table (F8-16) is an authorizer on the connection.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks"] }
