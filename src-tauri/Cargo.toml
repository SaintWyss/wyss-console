[package]
name = "wyss-console"
version = "0.2.0"
description = "Wyss Console desktop foundation"
edition = "2024"
rust-version = "1.90"
publish = false
default-run = "wyss-console"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same version Tauri already resolves for its GTK window. Used only to request
# KWin's blur through GDK's property API (no shell, no FFI).
gtk = "=0.18.2"

[dependencies]
sha2 = "0.10.9"
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
uuid = { version = "=1.27.0", features = ["v4"] }
time = { version = "=0.3.55", features = ["parsing", "formatting"] }

portable-pty = { version = "=0.9.0", default-features = false }
nix = { version = "=0.28.0", default-features = false, features = ["dir", "fs", "poll", "signal", "process", "user", "socket"] }

# The lifecycle hashes the authority binary it installs. A development build of that
# binary is hundreds of megabytes, and an unoptimized SHA-256 takes seconds over it.
[profile.dev.package.sha2]
opt-level = 3
