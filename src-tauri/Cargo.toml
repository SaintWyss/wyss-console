[package]
name = "wyss-console"
version = "0.1.0"
description = "Wyss Console desktop foundation"
edition = "2024"
rust-version = "1.90"
publish = false
default-run = "wyss-console"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
sha2 = "0.10.9"
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
uuid = { version = "=1.27.0", features = ["v4"] }
time = { version = "=0.3.55", features = ["parsing", "formatting"] }

portable-pty = { version = "=0.9.0", default-features = false }
nix = { version = "=0.28.0", default-features = false, features = ["fs", "poll", "signal", "process", "user", "socket"] }
